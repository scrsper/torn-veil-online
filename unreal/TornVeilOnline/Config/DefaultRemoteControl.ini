; Remote Control settings for the editor-automation channel.
;
; This file exists because `URemoteControlSettings` is declared `UCLASS(config = RemoteControl)`
; and compiled into the `RemoteControlCommon` module. Both halves of that matter, and this
; project previously had each of them wrong in turn:
;
;   * the config FILE is RemoteControl, so these keys are read from Config/DefaultRemoteControl.ini
;     (this file). Putting them in DefaultEngine.ini has no effect at all, whatever the section
;     is called -- that is where they used to live.
;   * the MODULE is RemoteControlCommon, so the section is
;     [/Script/RemoteControlCommon.RemoteControlSettings]. `RemoteControl.RemoteControlSettings`
;     names a module the class is not in, and Unreal silently ignores an unknown section.
;
; The symptom either mistake produces is identical and misleading: the web server still starts
; (bAutoStartWebServer defaults to true, and Launch.ps1 passes -RCWebControlEnable), so
; http://127.0.0.1:30010/remote/info answers 200 and the channel looks healthy, while every
; function call over it is refused. `bRestrictServerAccess` also defaults to true, so the
; restriction is in force whether or not the section is read -- which is exactly why a wrong
; section cannot be told apart from a right one by poking the endpoint.
;
; Three separate switches gate a Python call arriving as a console command, and all three are
; required (see WebRemoteControlInternalUtils::ValidateFunctionCall):
;
;   1. the call must be allowed at all. KismetSystemLibrary.ExecuteConsoleCommand is NOT in the
;      built-in AllowedRemoteFunctionCalls list, so it needs bAllowAnyRemoteFunctionCall.
;   2. bAllowConsoleCommandRemoteExecution must be true, or ExecuteConsoleCommand is refused.
;   3. bEnableRemotePythonExecution must be true, or a `py`/`python` command is stripped out
;      even when the console call itself is permitted.
;
; SECURITY, deliberately: together these let anything that can reach 127.0.0.1:30010 run
; arbitrary code in the editor. That is the point of the channel and also its whole risk. It is
; acceptable here because this is a local development client that is never packaged and never
; binds a public interface -- the loopback bind is the actual containment, not these flags. Do
; not carry this file into anything shipped.
;
; Level authoring must still not depend on this channel: Run-EditorPython.ps1 drives
; UnrealEditor-Cmd.exe -run=pythonscript and works with every one of these switches off.

[/Script/RemoteControlCommon.RemoteControlSettings]
bAutoStartWebServer=True
bAutoStartWebSocketServer=True
RemoteControlHttpServerPort=30010
RemoteControlWebSocketServerPort=30020
bRestrictServerAccess=True
bEnableRemotePythonExecution=True
bAllowConsoleCommandRemoteExecution=True
bAllowAnyRemoteFunctionCall=True
